<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Monitor - Arabic STT Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .status-processing { color: #fd7e14; }
        .status-completed { color: #198754; }
        .status-failed { color: #dc3545; }
        .status-uploaded { color: #6610f2; }
        
        .job-card {
            border-left: 4px solid #0d6efd;
            transition: all 0.3s ease;
        }
        
        .job-card.status-processing {
            border-left-color: #fd7e14;
            background: linear-gradient(135deg, #fff8f0 0%, #fff4e6 100%);
        }
        
        .job-card.status-completed {
            border-left-color: #198754;
            background: linear-gradient(135deg, #f0f8f4 0%, #e6f4ea 100%);
        }
        
        .job-card.status-failed {
            border-left-color: #dc3545;
            background: linear-gradient(135deg, #f8f0f0 0%, #f4e6e6 100%);
        }
        
        .progress-bar-container {
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(45deg, #0d6efd, #0b5ed7);
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        
        .processing .progress-bar-fill {
            background: linear-gradient(45deg, #fd7e14, #dc6500);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }
        
        .auto-refresh-indicator {
            font-size: 0.8em;
            color: #6c757d;
            margin-left: 10px;
        }
        
        .file-size {
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
            color: #6c757d;
        }
        
        .debug-info {
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.8em;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col">
                <div class="card border-0 shadow-sm">
                    <div class="card-body text-center">
                        <h1 class="display-5 fw-bold text-primary mb-2">
                            <i class="fas fa-tachometer-alt me-3"></i>Job Monitor
                        </h1>
                        <p class="text-muted">Real-time monitoring of Arabic STT transcription jobs</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="row mb-4">
            <div class="col">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-6">
                                <div class="d-flex align-items-center gap-3">
                                    <button class="btn btn-primary" onclick="refreshJobs()" id="refresh-btn">
                                        <i class="fas fa-sync-alt me-2"></i>Refresh
                                    </button>
                                    <button class="btn btn-outline-secondary" onclick="toggleAutoRefresh()" id="auto-refresh-btn">
                                        <i class="fas fa-pause me-2"></i>Pause Auto-refresh
                                    </button>
                                    <span class="auto-refresh-indicator" id="refresh-status">
                                        Auto-refreshing every 3 seconds
                                    </span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="d-flex align-items-center gap-3 justify-content-md-end">
                                    <!-- Search and Filter -->
                                    <div class="input-group" style="width: 250px;">
                                        <input type="text" class="form-control form-control-sm" id="job-search" 
                                               placeholder="Search jobs..." onkeyup="filterJobs()">
                                        <span class="input-group-text">
                                            <i class="fas fa-search"></i>
                                        </span>
                                    </div>
                                    <select class="form-select form-select-sm" id="status-filter" 
                                            onchange="filterJobs()" style="width: 140px;">
                                        <option value="">All Status</option>
                                        <option value="processing">Processing</option>
                                        <option value="completed">Completed</option>
                                        <option value="failed">Failed</option>
                                        <option value="uploaded">Uploaded</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col">
                                <div class="d-flex gap-3 justify-content-center">
                                    <button class="btn btn-outline-danger btn-sm" onclick="clearCompletedJobs()">
                                        <i class="fas fa-trash me-2"></i>Clear Completed
                                    </button>
                                    <button class="btn btn-outline-warning btn-sm" onclick="killAllProcessing()">
                                        <i class="fas fa-stop-circle me-2"></i>Kill All Processing
                                    </button>
                                    <div class="btn-group">
                                        <button class="btn btn-outline-info btn-sm dropdown-toggle" data-bs-toggle="dropdown">
                                            <i class="fas fa-download me-2"></i>Export Jobs
                                        </button>
                                        <ul class="dropdown-menu">
                                            <li><a class="dropdown-item" href="/api/jobs/export?format=json" target="_blank">
                                                <i class="fas fa-code me-2"></i>Export as JSON
                                            </a></li>
                                            <li><a class="dropdown-item" href="/api/jobs/export?format=csv" target="_blank">
                                                <i class="fas fa-table me-2"></i>Export as CSV
                                            </a></li>
                                        </ul>
                                    </div>
                                    <a href="/" class="btn btn-success btn-sm">
                                        <i class="fas fa-home me-2"></i>Back to Home
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Statistics -->
        <div class="row mb-4" id="stats-container" style="display: none;">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title text-muted mb-0">Total Jobs</h5>
                        <h2 class="text-primary fw-bold" id="total-jobs">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title text-muted mb-0">Processing</h5>
                        <h2 class="text-warning fw-bold" id="processing-jobs">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title text-muted mb-0">Completed</h5>
                        <h2 class="text-success fw-bold" id="completed-jobs">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title text-muted mb-0">Avg Duration</h5>
                        <h2 class="text-info fw-bold" id="avg-duration">-</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Jobs Container -->
        <div id="jobs-container">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted">Loading job information...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let autoRefreshInterval;
        let autoRefreshEnabled = true;
        const REFRESH_INTERVAL = 3000; // 3 seconds

        // Global variable to store all jobs for filtering
        let allJobs = [];

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            refreshJobs();
            loadStats();
            startAutoRefresh();
        });

        // Auto-refresh functionality
        function startAutoRefresh() {
            if (autoRefreshEnabled) {
                autoRefreshInterval = setInterval(() => {
                    refreshJobs();
                    loadStats();
                }, REFRESH_INTERVAL);
            }
        }

        function toggleAutoRefresh() {
            const btn = document.getElementById('auto-refresh-btn');
            const status = document.getElementById('refresh-status');
            
            if (autoRefreshEnabled) {
                clearInterval(autoRefreshInterval);
                autoRefreshEnabled = false;
                btn.innerHTML = '<i class="fas fa-play me-2"></i>Resume Auto-refresh';
                btn.classList.remove('btn-outline-secondary');
                btn.classList.add('btn-outline-success');
                status.textContent = 'Auto-refresh paused';
            } else {
                autoRefreshEnabled = true;
                startAutoRefresh();
                btn.innerHTML = '<i class="fas fa-pause me-2"></i>Pause Auto-refresh';
                btn.classList.remove('btn-outline-success');
                btn.classList.add('btn-outline-secondary');
                status.textContent = 'Auto-refreshing every 3 seconds';
            }
        }

        // API functions
        async function refreshJobs() {
            const refreshBtn = document.getElementById('refresh-btn');
            const container = document.getElementById('jobs-container');
            
            try {
                refreshBtn.disabled = true;
                refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Refreshing...';
                
                const response = await fetch('/api/jobs/all');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const jobs = await response.json();
                allJobs = jobs; // Store all jobs for filtering
                displayJobs(jobs);
                
            } catch (error) {
                console.error('Error fetching jobs:', error);
                container.innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        <h4 class="alert-heading"><i class="fas fa-exclamation-triangle me-2"></i>Error</h4>
                        <p>Failed to fetch job data: ${error.message}</p>
                        <hr>
                        <p class="mb-0">Please check if the server is running and try again.</p>
                    </div>
                `;
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.innerHTML = '<i class="fas fa-sync-alt me-2"></i>Refresh';
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/jobs/stats');
                if (response.ok) {
                    const stats = await response.json();
                    updateStats(stats);
                    document.getElementById('stats-container').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function updateStats(stats) {
            document.getElementById('total-jobs').textContent = stats.total_jobs || 0;
            document.getElementById('processing-jobs').textContent = stats.by_status?.processing || 0;
            document.getElementById('completed-jobs').textContent = stats.by_status?.completed || 0;
            document.getElementById('avg-duration').textContent = stats.average_duration ? 
                formatDuration(stats.average_duration) : '0s';
        }

        function displayJobs(jobs) {
            // Store jobs globally for filtering
            allJobs = jobs || [];
            
            const container = document.getElementById('jobs-container');
            
            if (!jobs || jobs.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                        <h3 class="text-muted">No jobs found</h3>
                        <p class="text-muted">No transcription jobs are currently running or completed.</p>
                        <a href="/" class="btn btn-primary mt-3">
                            <i class="fas fa-plus me-2"></i>Start New Job
                        </a>
                    </div>
                `;
                return;
            }

            // Apply current filters
            filterJobs();
        }

        function createJobCard(job) {
            const progress = calculateProgress(job);
            const duration = calculateDuration(job.created_at, job.completed_at, job.restarted_at);
            const fileSize = formatFileSize(job.file_size);
            
            return `
                <div class="card job-card status-${job.status} border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <!-- Job Header -->
                        <div class="row align-items-start mb-3">
                            <div class="col-md-8">
                                <div class="d-flex align-items-center mb-2">
                                    <h5 class="card-title mb-0 me-3">${job.original_filename || 'Unknown file'}</h5>
                                    <span class="badge bg-${getStatusColor(job.status)} status-${job.status}">
                                        ${getStatusIcon(job.status)} ${job.status}
                                    </span>
                                    ${job.restarted_at ? '<span class="badge bg-warning text-dark ms-2"><i class="fas fa-redo me-1"></i>Restarted</span>' : ''}
                                </div>
                                <small class="text-muted font-monospace">${job.job_id}</small>
                            </div>
                            <div class="col-md-4 text-end">
                                <div class="btn-group" role="group">
                                    <button class="btn btn-sm btn-outline-primary" onclick="toggleDetails('${job.job_id}')">
                                        <i class="fas fa-info-circle me-1"></i>Details
                                    </button>
                                    <button class="btn btn-sm btn-outline-secondary" onclick="debugJob('${job.job_id}')">
                                        <i class="fas fa-bug me-1"></i>Debug
                                    </button>
                                    ${job.status === 'processing' ? `
                                        <button class="btn btn-sm btn-outline-danger" onclick="killJob('${job.job_id}')">
                                            <i class="fas fa-stop me-1"></i>Kill
                                        </button>
                                    ` : ''}
                                    ${job.status === 'failed' || job.status === 'completed' ? `
                                        <button class="btn btn-sm btn-outline-warning" onclick="restartJob('${job.job_id}')">
                                            <i class="fas fa-redo me-1"></i>Restart
                                        </button>
                                    ` : ''}
                                    ${job.status === 'completed' ? `
                                        <div class="btn-group">
                                            <button class="btn btn-sm btn-outline-success dropdown-toggle" data-bs-toggle="dropdown">
                                                <i class="fas fa-download me-1"></i>Download
                                            </button>
                                            <ul class="dropdown-menu">
                                                <li><a class="dropdown-item" href="/download/${job.job_id}/txt">
                                                    <i class="fas fa-file-alt me-2"></i>Text (.txt)
                                                </a></li>
                                                <li><a class="dropdown-item" href="/download/${job.job_id}/srt">
                                                    <i class="fas fa-closed-captioning me-2"></i>Subtitles (.srt)
                                                </a></li>
                                                <li><a class="dropdown-item" href="/download/${job.job_id}/json">
                                                    <i class="fas fa-code me-2"></i>JSON (.json)
                                                </a></li>
                                            </ul>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>

                        <!-- Progress Bar -->
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill ${job.status}" style="width: ${progress}%"></div>
                        </div>

                        <!-- Job Info -->
                        <div class="row text-sm">
                            <div class="col-sm-6 col-md-3 mb-2">
                                <strong>Status:</strong><br>
                                <span class="status-${job.status}">
                                    ${job.message || job.status}
                                </span>
                            </div>
                            <div class="col-sm-6 col-md-3 mb-2">
                                <strong>Duration:</strong><br>
                                <span>${duration}</span>
                            </div>
                            <div class="col-sm-6 col-md-3 mb-2">
                                <strong>Created:</strong><br>
                                <span>${formatDate(job.created_at)}</span>
                            </div>
                            ${fileSize ? `
                            <div class="col-sm-6 col-md-3 mb-2">
                                <strong>File Size:</strong><br>
                                <span class="file-size">${fileSize}</span>
                            </div>
                            ` : ''}
                        </div>

                        <!-- Expandable Details -->
                        <div class="collapse mt-3" id="details-${job.job_id}">
                            <div class="card bg-light">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <h6>Processing Information</h6>
                                            <ul class="list-unstyled">
                                                <li><strong>Mode:</strong> ${job.processing_info?.processing_mode || 'Unknown'}</li>
                                                <li><strong>Model:</strong> ${job.processing_info?.model_used || 'Unknown'}</li>
                                                <li><strong>Processing Time:</strong> ${job.processing_info?.processing_time ? Math.round(job.processing_info.processing_time) + 's' : 'N/A'}</li>
                                                ${job.processing_info?.fallback_reason ? `<li><strong>Fallback:</strong> ${job.processing_info.fallback_reason}</li>` : ''}
                                            </ul>
                                        </div>
                                        <div class="col-md-6">
                                            <h6>Job Options</h6>
                                            <ul class="list-unstyled">
                                                <li><strong>Language:</strong> ${job.language || 'auto'}</li>
                                                <li><strong>Model Size:</strong> ${job.model_size || 'medium'}</li>
                                                <li><strong>Noise Reduction:</strong> ${job.noise_reduction ? 'Yes' : 'No'}</li>
                                                <li><strong>Voice Enhancement:</strong> ${job.voice_enhancement ? 'Yes' : 'No'}</li>
                                            </ul>
                                        </div>
                                    </div>
                                    
                                    <!-- Debug Section (hidden by default) -->
                                    <div class="debug-section" id="debug-${job.job_id}" style="display: none;">
                                        <hr>
                                        <h6>Debug Information</h6>
                                        <div class="debug-info" id="debug-content-${job.job_id}">
                                            Loading debug information...
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Utility functions
        function getStatusColor(status) {
            const colors = {
                'processing': 'warning',
                'completed': 'success',
                'failed': 'danger',
                'uploaded': 'primary'
            };
            return colors[status] || 'secondary';
        }

        function getStatusIcon(status) {
            const icons = {
                'processing': '🔄',
                'completed': '✅',
                'failed': '❌',
                'uploaded': '📤'
            };
            return icons[status] || '❓';
        }

        function calculateProgress(job) {
            switch (job.status) {
                case 'completed': return 100;
                case 'failed': return 0;
                case 'processing': 
                    // Use real step progress if available
                    if (job.processing_info && job.processing_info.step_progress) {
                        return job.processing_info.step_progress;
                    }
                    // Fallback to time-based estimate only if no real progress available
                    const duration = (new Date() - new Date(job.created_at)) / 1000 / 60;
                    return Math.min(Math.round(duration * 2), 95);
                default: return 10;
            }
        }

        function calculateDuration(createdAt, completedAt, restartedAt) {
            // If job was restarted, calculate duration from restart time
            const start = restartedAt ? new Date(restartedAt) : new Date(createdAt);
            const end = completedAt ? new Date(completedAt) : new Date();
            const diffMs = end - start;
            return formatDuration(diffMs / 1000);
        }

        function formatDuration(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            
            if (hours > 0) {
                return `${hours}h ${minutes}m`;
            } else if (minutes > 0) {
                return `${minutes}m ${secs}s`;
            } else {
                return `${secs}s`;
            }
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleString();
        }

        function formatFileSize(bytes) {
            if (!bytes) return null;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            if (bytes === 0) return '0 Bytes';
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return parseFloat((bytes / Math.pow(1024, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Interactive functions
        function toggleDetails(jobId) {
            const details = document.getElementById(`details-${jobId}`);
            const collapse = new bootstrap.Collapse(details);
            collapse.toggle();
        }

        async function debugJob(jobId) {
            const debugSection = document.getElementById(`debug-${jobId}`);
            const debugContent = document.getElementById(`debug-content-${jobId}`);
            
            if (debugSection.style.display === 'none') {
                debugSection.style.display = 'block';
                
                try {
                    const response = await fetch(`/api/jobs/${jobId}/debug`);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    const debugInfo = await response.json();
                    debugContent.textContent = JSON.stringify(debugInfo, null, 2);
                    
                } catch (error) {
                    debugContent.textContent = `Error loading debug information: ${error.message}`;
                }
            } else {
                debugSection.style.display = 'none';
            }
            
            // Also expand the details if not already expanded
            const details = document.getElementById(`details-${jobId}`);
            if (!details.classList.contains('show')) {
                const collapse = new bootstrap.Collapse(details);
                collapse.show();
            }
        }

        async function clearCompletedJobs() {
            if (!confirm('Are you sure you want to clear all completed jobs? This action cannot be undone.')) {
                return;
            }
            
            try {
                const response = await fetch('/api/jobs/clear-completed', {
                    method: 'POST'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                alert(`Successfully cleared ${result.cleared_count} completed jobs`);
                refreshJobs();
                loadStats();
                
            } catch (error) {
                console.error('Clear failed:', error);
                alert(`Failed to clear completed jobs: ${error.message}`);
            }
        }

        async function killJob(jobId) {
            if (!confirm(`Are you sure you want to kill job ${jobId}? This will stop the processing immediately.`)) {
                return;
            }
            
            try {
                const response = await fetch(`/api/jobs/${jobId}/kill`, {
                    method: 'POST'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                
                if (result.success) {
                    alert(`Job ${jobId} killed successfully. ${result.message || 'Job terminated.'}`);
                    refreshJobs();
                    loadStats();
                } else {
                    throw new Error(result.error || 'Unknown error');
                }
                
            } catch (error) {
                console.error('Kill job failed:', error);
                alert(`Failed to kill job: ${error.message}`);
            }
        }

        async function restartJob(jobId) {
            if (!confirm(`Are you sure you want to restart job ${jobId}? This will reprocess the original file.`)) {
                return;
            }
            
            try {
                const response = await fetch(`/api/jobs/${jobId}/restart`, {
                    method: 'POST'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                
                if (result.success) {
                    alert(`Job ${jobId} restarted successfully. Cleaned up ${result.cleaned_files} files and started reprocessing.`);
                    refreshJobs();
                    loadStats();
                } else {
                    throw new Error(result.error || 'Unknown error');
                }
                
            } catch (error) {
                console.error('Restart job failed:', error);
                alert(`Failed to restart job: ${error.message}`);
            }
        }

        // Filter jobs based on search and status
        function filterJobs() {
            const searchTerm = document.getElementById('job-search').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;
            
            const filteredJobs = allJobs.filter(job => {
                const matchesSearch = !searchTerm || 
                    job.original_filename.toLowerCase().includes(searchTerm) ||
                    job.job_id.toLowerCase().includes(searchTerm) ||
                    job.message.toLowerCase().includes(searchTerm);
                
                const matchesStatus = !statusFilter || job.status === statusFilter;
                
                return matchesSearch && matchesStatus;
            });
            
            displayFilteredJobs(filteredJobs);
        }

        function displayFilteredJobs(jobs) {
            const container = document.getElementById('jobs-container');
            
            if (!jobs || jobs.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-search fa-3x text-muted mb-3"></i>
                        <h3 class="text-muted">No jobs match your criteria</h3>
                        <p class="text-muted">Try adjusting your search or filter settings.</p>
                        <button class="btn btn-outline-primary" onclick="clearFilters()">
                            <i class="fas fa-times me-2"></i>Clear Filters
                        </button>
                    </div>
                `;
                return;
            }

            // Sort jobs by creation date (newest first)
            jobs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const jobsHTML = jobs.map(job => createJobCard(job)).join('');
            container.innerHTML = jobsHTML;
        }

        function clearFilters() {
            document.getElementById('job-search').value = '';
            document.getElementById('status-filter').value = '';
            displayJobs(allJobs);
        }

        async function killAllProcessing() {
            const processingJobs = allJobs.filter(job => job.status === 'processing');
            
            if (processingJobs.length === 0) {
                alert('No processing jobs to kill.');
                return;
            }
            
            if (!confirm(`Are you sure you want to kill all ${processingJobs.length} processing jobs? This action cannot be undone.`)) {
                return;
            }
            
            let killedCount = 0;
            let failedCount = 0;
            
            for (const job of processingJobs) {
                try {
                    const response = await fetch(`/api/jobs/${job.job_id}/kill`, {
                        method: 'POST'
                    });
                    
                    if (response.ok) {
                        killedCount++;
                    } else {
                        failedCount++;
                    }
                } catch (error) {
                    console.error(`Failed to kill job ${job.job_id}:`, error);
                    failedCount++;
                }
            }
            
            alert(`Bulk kill operation completed: ${killedCount} jobs killed, ${failedCount} failed.`);
            refreshJobs();
            loadStats();
        }
    </script>
</body>
</html>
